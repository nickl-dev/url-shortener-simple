<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shorten a link</title>
    <meta
      name="description"
      content="Paste a long URL, get a short one. Fast, free, no sign-up."
    />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shorten a link" />
    <meta
      property="og:description"
      content="Paste a long URL, get a short one."
    />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shorten a link" />
    <meta
      name="twitter:description"
      content="Paste a long URL, get a short one."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
